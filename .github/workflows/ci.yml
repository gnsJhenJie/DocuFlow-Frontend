name: DocuFlow CI

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x] # Consistent with README and devcontainer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # If your build requires environment variables (e.g., for Genkit initialization during build),
          # you would configure them here, likely using GitHub secrets.
          # Example: GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:3000/api" # Adjust as needed for local testing
          CI: true # Common flag for CI environments
