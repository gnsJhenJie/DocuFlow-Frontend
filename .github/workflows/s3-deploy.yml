name: Deploy frontend static site

on:
  push:
    branches: [prod]

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "819498957810"
  S3_BUCKET: nycu-docuflow
  CF_DISTRIBUTION: E1UXL1NTSYTMEN

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/DocuFlow-Frontend-Github-Actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync ./out s3://$S3_BUCKET/frontend \
            --delete \
            --cache-control 'public, max-age=31536000, immutable' \
            --exclude 'index.html' --exclude '404.html'
          # index & 404 再上傳一次，cache 低一點
          aws s3 cp ./out/index.html s3://$S3_BUCKET/frontend/index.html \
            --cache-control 'no-cache, must-revalidate'
          aws s3 cp ./out/404.html  s3://$S3_BUCKET/frontend/404.html  \
            --cache-control 'no-cache, must-revalidate'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION \
            --paths "/*"
